services:
  - type: web
    name: agrointeligente-api
    runtime: node
    region: oregon
    plan: free
    rootDir: api-node
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PYTHON_ENGINE_URL
        sync: false
      - key: ALERTAS_INTERVAL_MS
        value: "1800000"

  - type: web
    name: agrointeligente-motor
    runtime: python
    region: oregon
    plan: free
    rootDir: motor-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
